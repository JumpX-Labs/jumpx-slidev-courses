name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all Slidev decks
        run: npm run build

      - name: Collect all dist outputs
        run: |
          mkdir -p _site
          for deck_dist in courses/*/*/dist/slides; do
            course=$(echo $deck_dist | cut -d'/' -f2)
            lesson=$(echo $deck_dist | cut -d'/' -f3)
            target="_site/courses/$course/$lesson"
            mkdir -p "$target"
            cp -r "$deck_dist/." "$target/"
          done

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=jumpx-slidev-courses --branch=main
