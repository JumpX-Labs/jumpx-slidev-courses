name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build all Slidev decks (with correct --base path)
        run: |
          for slides in courses/*/*/slides.md; do
            course=$(echo $slides | cut -d'/' -f2)
            lesson=$(echo $slides | cut -d'/' -f3)
            base="/courses/$course/$lesson/"
            echo "Building $slides with base=$base"
            npx slidev build "$slides" --base "$base"
          done

      - name: Collect all dist outputs
        run: |
          mkdir -p _site
          for slides in courses/*/*/slides.md; do
            course=$(echo $slides | cut -d'/' -f2)
            lesson=$(echo $slides | cut -d'/' -f3)
            src="courses/$course/$lesson/dist"
            target="_site/courses/$course/$lesson"
            echo "Collecting $src -> $target"
            mkdir -p "$target"
            cp -r "$src/." "$target/"
          done
          echo "=== _site structure ==="
          find _site -maxdepth 4 -type d

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy _site --project-name=jumpx-slidev-courses --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
